<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food Slideshow</title>
<style>
:root{color-scheme:dark;--bg:#000}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
.stage{position:fixed;inset:0;background:var(--bg)}
.s{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .6s ease}
.s.on{opacity:1}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#888;font:18px system-ui,sans-serif}
</style>
</head>
<body>
<div class="stage" id="stage"><div id="msg">No photos yet</div></div>
<script>
(function(){
  var stage=document.getElementById('stage'),msg=document.getElementById('msg'),cur='',els=[],i=0;
  function build(list){
    els.forEach(function(e){e.remove()});els=[];i=0;
    list.forEach(function(n,k){
      var im=new Image();
      im.className='s'+(k===0?' on':'');
      im.src='images/'+n;im.alt='Food photo';
      stage.appendChild(im);els.push(im);
    });
    msg.style.display=list.length?'none':'flex';
  }
  function tick(){
    if(els.length<2)return;
    els[i].classList.remove('on');
    i=(i+1)%els.length;
    els[i].classList.add('on');
  }
  function load(){
    fetch('photos.json?t='+Date.now(),{cache:'no-store'})
      .then(function(r){return r.ok?r.json():[]})
      .then(function(list){var s=JSON.stringify(list);if(s!==cur){cur=s;build(list)}})
      .catch(function(){});
  }
  load();
  setInterval(load,60000);
  setInterval(tick,3000);
})();
</script>
</body>
</html>
